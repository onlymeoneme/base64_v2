name: V2Ray

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography

      # Восстанавливаем ключ из GitHub Secret.
      # Используем printf вместо echo — echo добавляет \n в конец,
      # что ломает бинарный ключ и вызывает ValueError в AESGCM.
      # Как добавить секрет:
      #   1. Запусти main.py локально — появится secret.key.b64
      #   2. Скопируй содержимое secret.key.b64
      #   3. GitHub репо → Settings → Secrets → Actions → New secret
      #      Name:  AES_SECRET_KEY
      #      Value: <содержимое secret.key.b64>
      - name: Restore encryption key
        run: |
          printf '%s' "${{ secrets.AES_SECRET_KEY }}" | base64 -d > secret.key

      - name: Run scraper
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update V2Ray subscriptions" && git push)
